#hyprland minimal config
#monitor=,auto

#variables
$terminal = alacritty
$browser = firefox
$fileManager = thunar
$menu = rofi -show drun

#keybinds
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B, exec, $browser
bind = SUPER, E, exec, $fileManager
bind = SUPER, SPACE, exec, $menu
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, P, exec, ~/.local/bin/powermenu

#screenshots (grimblast)
bind = SUPER, S, exec, sh -c 'grimblast save screen /home/onkar/Pictures/screenshots/$(date +%F_%H-%M-%S).png'
bind = SUPER SHIFT, S, exec, sh -c 'grimblast save area /home/onkar/Pictures/screenshots/$(date +%F_%H-%M-%S).png' 

#autostart
exec-once = swww init
exec-once = nm-applet
exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = swaybg -i ~/Pictures/wallpapers/dexter.png -m fill

#lockscreen
bind = SUPER, L, exec, hyprlock

#input
input {
	kb_layout = us
	follow_mouse = 1
	touchpad {
		natural_scroll = true
	}
}

#general
general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(88c0d0ff)
	col.inactive_border = rgba(444444aa)
}

#decoration
decoration {
	blur {
		enabled = true 
		size = 8
		passes = 2
	}
}

#animations
animations {
	enabled = true
	animation = windows,1,7,default
	animation = border,1,10,default
	animation = fade,1,7,default
}

#audio
bind = SUPER, F8, exec, pamixer -i 5
bind = SUPER, F9, exec, pamixer -d 5
bind = SUPER, F10, exec, pamixer -t

#brightness
bind = SUPER, F5, exec, brightnessctl set +10%
bind = SUPER, F6, exec, brightnessctl set 10%-

#screenshot
bind = SUPER, S, exec, grim -g "$(slurp)" - | wl-copy

#workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

#misc
misc {
	disable_hyprland_logo = true
	disable_splash_rendering = true
} 
